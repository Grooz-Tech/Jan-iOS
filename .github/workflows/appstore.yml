name: App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appstore-${{ github.ref }}

jobs:
  deploy:
    runs-on: tartelet
    environment: appstore
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_API_KEY_ADMIN_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build number = <minutes-since-2024>.<channel>, channel 3 = App Store.
      # The time-dominant leading component is globally monotonic across all
      # workflows; the trailing digit identifies the channel without affecting
      # ordering. UInt32-safe. Marketing version from Version.xcconfig.
      - name: Set build number
        run: echo "TUIST_CURRENT_PROJECT_VERSION=$(( ($(date -u +%s) - 1704067200) / 60 )).3" >> "$GITHUB_ENV"

      - name: Configure git auth
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Install dependencies
        run: tuist install

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build
        run: fastlane build

      - name: Upload IPA and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Jan-${{ env.TUIST_CURRENT_PROJECT_VERSION }}
          path: |
            *.ipa
            *.dSYM.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload to App Store Connect (no submit)
        run: fastlane release
