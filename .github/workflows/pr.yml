name: PR

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: tartelet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git auth
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Install dependencies
        run: tuist install

      - name: Keychain probe after install (TEMP)
        run: |
          echo "launchctl managername: $(launchctl managername 2>/dev/null || echo '<unavailable>')"
          echo "console owner: $(stat -f '%Su' /dev/console 2>/dev/null || echo '<none>')"
          echo "helper: $(git config --show-origin --get-all credential.helper 2>&1 || echo '<none>')"
          rc=0; security find-internet-password -s github.com >/dev/null 2>&1 || rc=$?; echo "find github.com after install status=$rc"
          rc=0; security find-internet-password -s github.com -w >/dev/null 2>&1 || rc=$?; echo "read github.com data (-w) after install status=$rc"

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Run tests
        run: fastlane test

  build:
    runs-on: tartelet
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build number = <minutes-since-2024>.<channel>, channel 1 = PR.
      # The time-dominant leading component is globally monotonic across all
      # workflows; the trailing digit identifies the channel without affecting
      # ordering. UInt32-safe. Marketing version from Version.xcconfig.
      - name: Set build number
        run: echo "TUIST_CURRENT_PROJECT_VERSION=$(( ($(date -u +%s) - 1704067200) / 60 )).1" >> "$GITHUB_ENV"

      - name: Configure git auth
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: TEMP direct git clone with GIT_TRACE (same probe as inDriver kz3)
        env:
          GIT_TRACE: "1"
        run: |
          echo "helper: $(git config --show-origin --get-all credential.helper 2>&1 || echo '<none>')"
          rm -rf /tmp/probe-clone
          rc=0; security find-internet-password -s github.com "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1 || rc=$?; echo "login BEFORE=$rc"
          echo "--- git clone (trace, token masked) ---"
          git clone --depth 1 https://github.com/Grooz-Tech/iOS-certificates.git /tmp/probe-clone 2>&1 \
            | grep -iE "credential|insteadof|run_command|helper|osxkeychain" \
            | sed -E 's#x-access-token:[^@]*@#x-access-token:***@#g' | head -40 || echo "<no matching trace lines>"
          rc=0; security find-internet-password -s github.com "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1 || rc=$?; echo "login AFTER=$rc"
          rm -rf /tmp/probe-clone

      - name: Install dependencies
        run: tuist install

      - name: Keychain probe after install (TEMP)
        run: |
          echo "launchctl managername: $(launchctl managername 2>/dev/null || echo '<unavailable>')"
          echo "console owner: $(stat -f '%Su' /dev/console 2>/dev/null || echo '<none>')"
          rc=0; security find-internet-password -s github.com >/dev/null 2>&1 || rc=$?; echo "find github.com after install status=$rc"
          rc=0; security find-internet-password -s github.com -w >/dev/null 2>&1 || rc=$?; echo "read github.com data (-w) after install status=$rc"

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build
        run: fastlane build

      - name: Upload IPA and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Jan-${{ env.TUIST_CURRENT_PROJECT_VERSION }}
          path: |
            *.ipa
            *.dSYM.zip
          if-no-files-found: error
          retention-days: 14
