name: PR

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: tartelet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git auth
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Unlock keychain
        run: |
          kc="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings "$kc"

      - name: Install dependencies
        run: tuist install

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Run tests
        run: fastlane test

  build:
    runs-on: tartelet
    env:
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build number = <minutes-since-2024>.<channel>, channel 1 = PR.
      # The time-dominant leading component is globally monotonic across all
      # workflows; the trailing digit identifies the channel without affecting
      # ordering. UInt32-safe. Marketing version from Version.xcconfig.
      - name: Set build number
        run: echo "TUIST_CURRENT_PROJECT_VERSION=$(( ($(date -u +%s) - 1704067200) / 60 )).1" >> "$GITHUB_ENV"

      - name: Configure git auth
        uses: ./.github/actions/git-auth
        with:
          token: ${{ secrets.GIT_AUTH_TOKEN }}

      - name: Unlock keychain
        run: |
          kc="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings "$kc"

      - name: Install dependencies
        run: tuist install

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build
        run: fastlane build

      - name: Upload IPA and dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Jan-${{ env.TUIST_CURRENT_PROJECT_VERSION }}
          path: |
            *.ipa
            *.dSYM.zip
          if-no-files-found: error
          retention-days: 14
